services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      REMINDERHUB_DB_HOST: db
      REMINDERHUB_DB_NAME: ${REMINDERHUB_DB_NAME:-reminderhub}
      REMINDERHUB_DB_USER: ${REMINDERHUB_DB_USER:-reminderhub_app}
      REMINDERHUB_DB_PASS: ${REMINDERHUB_DB_PASS:?Set REMINDERHUB_DB_PASS in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reminderhub}
      MYSQL_USER: ${MYSQL_USER:-reminderhub_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - reminderhub_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  reminderhub_mysql:
